<!DOCTYPE html>

<html>
    <head>
        <title>idol list</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scaleable=no" />
        <link rel="stylesheet" href="css/main.css" />
    </head>

    <body onload="loadPage(); savePage();">
        <div class="navbar">
            <a href="index.html" class="navbar">home</a>
            <a href="members.html" class="navbar">members</a>
            <a href="spreadsheet.html" target="_blank" class="navbar">songs</a>

        </div>

        <h1>enter choice</h1>

        <div class="normal">
            <h2 id="member-name">name</h2>
            <label for="input">enter song name:</label><br>
            <input type="text" class="input-field" id="input" placeholder="choose song..." name="song"  oninput="displayChoice()"><br>

            <input class="button" type="button" value="submit" id="submit-song" onclick="getSong()"/>
        </div>

        <div class="normal">
            <h2 id="song-name"></h2>
            <a href="" id="song-url"></a>
            <center> <img id="song-image" src="" ></center>
        </div>

        <div class="normal">

            <button class="button" type="button" onclick="randomizeMembers()">input members</button>
            <button class="button" type="button" onclick="openLinks()">open links</button>

            <table id="member-table">
            <thead>
                <tr>
                    <th>name</th>
                    <th>song</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>

        
        </div>



        <table hidden="hidden" id="sheet" class="collapse">
         <thead>
            <tr>
                <th>Group</th>
                <th>Song Name</th>
                <th>Members</th>
                <th>URL</th>
                <th>Category</th>
                <th>Type</th>
                <th>Year of Release</th>
                <th>Tags</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

        <script src="script.js"></script>

    </body>
</html>
