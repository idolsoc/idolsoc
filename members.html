<!DOCTYPE html>

<html>
    <head>
        <title>idol list</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scaleable=no" />
        <link rel="stylesheet" href="css/main.css" />
    </head>

    <body>
        <div class="navbar">
            <a href="index.html" class="navbar">home</a>
            <a href="members.html" class="navbar">members</a>
            <a href="spreadsheet.html" target="__blank" class="navbar">songs</a>
        </div>

        <h1>members</h1>

        <div class="normal">
            
            <h2>choose members</h2>

            <table id="members-sheet">
                <thead>
                    <tr>
                        <th>Members</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>

            <input class="button" type="button" value="submit" id="submit" onclick="getMembers()"/>

            <input class="button" type="button" value="clear" id="clear" onclick="clearMembers()"/>
        </div>

        <center><button class="button" id="collapse" type="button" onclick="toggleForm()">add new member</button></center>


        <div class="div-form" id="song-form">
            <h3>add new member</h3>

            <form action="https://api.sheetmonkey.io/form/PG6ApbAA1uv7yFCvJCKXZ" method="post">
                <label>new member name: <input type="text" name="Member" required /></label>
                <input type="hidden" name="Created" value="x-sheetmonkey-current-date-time" />
                <input type="hidden"name="x-sheetmonkey-insert-worksheet" value="Members"/>
                <input type="submit" value="Submit" />
            </form>
        </div>

        <script src="script.js"></script>
    </body>
</html>
